[[stack]]
name = "home-edge"
description = "Public ingress and certificate automation"
tags = ["home", "production", "edge"]
deploy = false

[stack.config]
server = "home-docker"
repo = "zrr1999/zrr-compose"
branch = "main"
clone_path = "/etc/komodo/stacks/home-edge"
run_directory = "deployments/home/home-edge"
file_paths = ["compose.yml", "compose.migration.yml"]
project_name = "home-edge"
poll_for_updates = true
auto_update = false
send_alerts = true

