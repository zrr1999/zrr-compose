name: home-monitor

services:
  speedtest:
    container_name: speedtest
    image: ghcr.io/librespeed/speedtest:5.5.1@sha256:1c8ca636a9b68d023c819c5ce6e7fab3f5214b963138eb9ef6aaddf9ae111c77
    restart: unless-stopped
    env_file:
      - path: /etc/zrr-compose/env/speedtest.env
        required: true
    networks: [default, edge]
    labels:
      caddy: speedtest.zrr.dev speedtest.home.sixbones.dev
      caddy.reverse_proxy: "{{upstreams 8080}}"

  speedtest-tracker:
    container_name: speedtest-tracker
    image: lscr.io/linuxserver/speedtest-tracker:v1.14.5-ls162@sha256:e4732e8e9073bdd5b419959c1151b761afa591166328d2ab751adc1e3d070563
    restart: unless-stopped
    env_file:
      - path: /etc/zrr-compose/env/speedtest-tracker.env
        required: true
    volumes:
      - /root/zrr-compose/volumes/speedtest:/config
    networks: [default, edge]
    labels:
      caddy: speedtest-tracker.zrr.dev speedtest-tracker.home.sixbones.dev
      caddy.reverse_proxy: "{{upstreams 80}}"
      homepage.name: Speedtest Tracker
      homepage.description: 最近网络速度
      homepage.icon: librespeed.svg
      homepage.widget.type: https://speedtest-tracker.zrr.dev

  scrutiny:
    container_name: scrutiny
    image: ghcr.io/analogj/scrutiny:v0.9.3-omnibus@sha256:2f3d23edadf6d12f9c26d16808bd8620852a37dd3074e814352a2328d48fccb0
    restart: unless-stopped
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    devices:
      - /dev/nvme0:/dev/nvme0
    ports:
      - 8866:8080
      - 8867:8086
    volumes:
      - /run/udev:/run/udev:ro
      - /root/zrr-compose/volumes/scrutiny/config:/opt/scrutiny/config
      - /root/zrr-compose/volumes/scrutiny/influxdb:/opt/scrutiny/influxdb
    networks: [default, edge]
    labels:
      caddy: scrutiny.zrr.dev scrutiny.home.sixbones.dev
      caddy.reverse_proxy: "{{upstreams 8080}}"

networks:
  edge:
    external: true
    name: edge
