services:
  jellyfin:
    image: linuxserver/jellyfin:10.9.11
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
    volumes:
      - ../volumes/jellyfin:/config
      # - torrent-downloads:/data
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 8096:8096
      - 7359:7359/udp
      - 1900:1900/udp
    restart: unless-stopped
    labels:
      caddy.reverse_proxy: "{{upstreams 8096}}"

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    ports:
      - '8191:8191'
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
    labels:
      caddy.reverse_proxy: "{{upstreams 8191}}"

  jellyseerr:
    image: fallenbagel/jellyseerr
    environment:
      - TZ=Asia/Shanghai
    ports:
      - '5055:5055'
    volumes:
      - '../volumes/jellyseerr:/app/config'
    restart: unless-stopped
    labels:
      caddy.reverse_proxy: "{{upstreams 5055}}"
    dns:
      - 8.8.8.8
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - ../volumes/sonarr:/config
      # - /mnt/d/jellyfin/tv:/tv
      # - /mnt/d/jellyfin/下载:/downloads
    restart: unless-stopped
    labels:
      caddy.reverse_proxy: "{{upstreams 8989}}"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Asia/Shanghai
    volumes:
      - ../volumes/radarr:/config
      # - /mnt/d/jellyfin/movies:/movies
      # - /mnt/d/jellyfin/下载:/downloads
    restart: unless-stopped
    labels:
      caddy.reverse_proxy: "{{upstreams 7878}}"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    volumes:
      - ../volumes/prowlarr:/config
    restart: unless-stopped
    labels:
      caddy.reverse_proxy: "{{upstreams 9696}}"

  alist:
    image: openlistteam/openlist:latest
    container_name: alist
    volumes:
      - ../volumes/alist:/opt/alist/data
    ports:
      - 5244:5244
    environment:
      - PUID=0
      - PGID=0
      - UMASK=022
    restart: unless-stopped
    labels:
      caddy.reverse_proxy: "{{upstreams 5244}}"

  aria2:
    image: p3terx/aria2-pro
    restart: unless-stopped
    environment:
      - DISK_CACHE=64M
      - TZ=Asia/Shanghai
    env_file:
      - path: ${AUTO_TOKEN_ENV_DIR}/aria2.env
        required: false
    ports:
      - 6800:6800
      - 6881:6881
      - 6881:6881/udp
    volumes:
      - ../volumes/aria2/config:/config
      - ../volumes/aria2/downloads:/downloads
    labels:
      caddy.reverse_proxy: "{{upstreams 6800}}"

  ariang:
    image: p3terx/ariang
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 1m
    labels:
      caddy.reverse_proxy: "{{upstreams 6880}}"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.0.0
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - WEBUI_PORT=5080
    volumes:
      - ../volumes/qbittorrent:/config
      # - torrent-downloads:/downloads
    ports:
      - 5080:5080
      - 6881:6881
      - 6881:6881/udp
    restart: "unless-stopped"
    labels:
      caddy.reverse_proxy: "{{upstreams 5080}}"
